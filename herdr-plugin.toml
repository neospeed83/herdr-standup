id = "herdr-standup"
name = "Herdr Standup"
version = "0.3.2"
min_herdr_version = "0.8.0"
description = "Answer what you worked on yesterday from Git evidence and Herdr context"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["sh", "scripts/install-binary.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-ExecutionPolicy", "Bypass", "-File", "scripts/install-binary.ps1"]
platforms = ["windows"]

[[build]]
command = ["bin/herdr-standup", "install"]

[[actions]]
id = "generate"
title = "Generate yesterday's standup"
contexts = ["workspace"]
command = ["bin/herdr-standup", "generate"]

[[actions]]
id = "open"
title = "Open Herdr Standup"
contexts = ["workspace"]
command = ["bin/herdr-standup", "open"]

[[actions]]
id = "remove-keybinding"
title = "Remove Standup keybinding"
command = ["bin/herdr-standup", "remove-keybinding"]

[[panes]]
id = "standup"
title = "Herdr Standup"
placement = "popup"
width = "82%"
height = "82%"
command = ["bin/herdr-standup", "show"]
