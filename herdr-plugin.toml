id = "herdr-standup"
name = "Herdr Standup"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Answer what you worked on yesterday from Git evidence and Herdr context"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "generate"
title = "Generate yesterday's standup"
contexts = ["workspace"]
command = ["node", "src/standup.mjs", "generate"]

[[actions]]
id = "open"
title = "Open Herdr Standup"
contexts = ["workspace"]
command = ["node", "src/open.mjs"]

[[panes]]
id = "standup"
title = "Herdr Standup"
placement = "popup"
width = "82%"
height = "82%"
command = ["node", "src/standup.mjs", "show"]

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-standup.open"
description = "open Herdr Standup"
