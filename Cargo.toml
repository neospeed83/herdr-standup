[package]
name = "herdr-standup"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
